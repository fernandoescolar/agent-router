    plural: guardrailpolicies
    singular: guardrailpolicy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[-1:].type
      name: Status
      type: string
    deprecated: true
    deprecationWarning: aigateway.envoyproxy.io/v1alpha1 is deprecated; use aigateway.envoyproxy.io/v1beta1
      instead
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: GuardrailPolicy evaluates content safety checks for request and
          response payloads.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: GuardrailPolicySpec contains the configured checks attached
              to an AIServiceBackend.
            properties:
              rules:
                description: Rules are executed in order and can evaluate request
                  or response payloads.
                items:
                  description: GuardrailRule defines one content-safety check to apply
                    to a request or response.
                  properties:
                    name:
                      description: Name is a stable identifier for the rule.
                      minLength: 1
                      type: string
                    phase:
                      description: Phase determines whether the rule runs against
                        the request or the response payload.
                      enum:
                      - Request
                      - Response
                      type: string
                    provider:
                      description: Provider configures how the rule is evaluated.
                      properties:
                        action:
                          default: Block
                          description: Action is the action taken when the rule is
                            matched.
                          type: string
                        message:
                          description: Message is returned to the caller when the
                            rule blocks a request or response.
                          type: string
                        pattern:
                          description: Pattern is used for deterministic regex-based
                            evaluations.
                          type: string
                        type:
                          description: Type identifies the guardrail implementation.
                          enum:
                          - Regex
                          - Presidio
                          - Bedrock
                          - AzureContentSafety
                          type: string
                      required:
                      - type
                      type: object
                  required:
                  - name
                  - phase
                  - provider
                  type: object
                maxItems: 32
                type: array
              targetRefs:
                description: TargetRefs are the names of the AIServiceBackend resources
                  this GuardrailPolicy is attached to.
                items:
                  description: |-
                    LocalPolicyTargetReference identifies an API object to apply a direct or
                    inherited policy to. This should be used as part of Policy resources
                    that can target Gateway API resources. For more information on how this
                    policy attachment model works, and a sample Policy resource, refer to
                    the policy attachment documentation for Gateway API.
                  properties:
                    group:
                      description: Group is the group of the target resource.
                      maxLength: 253
                      pattern: ^$|^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                      type: string
                    kind:
                      description: Kind is kind of the target resource.
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-zA-Z]([-a-zA-Z0-9]*[a-zA-Z0-9])?$
                      type: string
                    name:
                      description: Name is the name of the target resource.
                      maxLength: 253
                      minLength: 1
                      type: string
                  required:
                  - group
                  - kind
                  - name
                  type: object
                maxItems: 16
                type: array
                x-kubernetes-validations:
                - message: targetRefs must reference AIServiceBackend resources
                  rule: self.all(ref, ref.group == 'aigateway.envoyproxy.io' && ref.kind
                    == 'AIServiceBackend')
            type: object
          status:
            description: Status defines the status details of the GuardrailPolicy.
            properties:
              conditions:
                description: |-
                  Conditions is the list of conditions by the reconciliation result.
                  Currently, at most one condition is set.

                  Known .status.conditions.type are: "Accepted", "NotAccepted".
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: false
    subresources:
      status: {}
